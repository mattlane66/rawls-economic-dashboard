# Low-noise dependency maintenance. Dependabot opens reviewable PRs; no auto-merges.
# Security alerts, security-update toggles, and secret scanning are managed separately
# under the repository's GitHub Settings.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      npm-dependencies:
        patterns:
          - "*"
